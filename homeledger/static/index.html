<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HomeLedger</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b4a8f">
<link rel="stylesheet" href="style.css">
</head>
<body class="sz-large">
<script>try{document.documentElement.dataset.look=localStorage.getItem("hl-look")||"prime"}catch(e){document.documentElement.dataset.look="prime"}</script>
<div id="print-head" aria-hidden="true"><img src="logo.png" alt="HomeLedger"><div class="ph-text"><b id="ph-company"></b><div id="ph-title"></div><div id="ph-date"></div></div></div>
<div id="top">
  <img class="brand-icon" src="icon.png" alt=""><span class="brand">HomeLedger</span>
  <span class="company" id="company"></span>
  <span class="crumb" id="crumb"></span>
  <span class="spacer"></span>
  <input type="search" id="qsearch" placeholder="Search entries (Ctrl+F)" aria-label="Search entries">
  <span class="clock" id="clock"></span>
</div>
<div id="menubar" role="menubar" aria-label="Menu">
  <button type="button" data-a="goto"><u>G</u>: Go To</button>
  <button type="button" data-a="company"><u>K</u>: Company</button>
  <button type="button" data-a="data"><u>Y</u>: Data</button>
  <button type="button" data-a="export"><u>E</u>: Export</button>
  <button type="button" data-a="print"><u>P</u>: Print</button>
  <button type="button" data-a="lock" id="mb-lock" style="display:none"><u>L</u>: Lock</button>
  <span class="spacer"></span>
  <button type="button" data-a="help">Shift+F1: Help</button>
</div>
<div id="main">
  <div id="screen" tabindex="-1"></div>
  <div id="keys" aria-label="Keys"></div>
</div>
<div id="status"><span class="msg" id="msg">Ready</span><span class="right" id="saved"></span></div>
<div id="modal-root"></div>
<div id="tip"></div>
<script src="core.js"></script>
<script src="charts.js"></script>
<script src="screens_a.js"></script>
<script src="screens_b.js"></script>
<script src="screens_c.js"></script>
<script src="screens_d.js"></script>
<script src="screens_e.js"></script>
<script src="screens_f.js"></script>
<script src="screens_g.js"></script>
<script src="screens_h.js"></script>
<script src="auth.js"></script>
<script src="goto.js"></script>
<script src="app.js"></script>
</body>
</html>
