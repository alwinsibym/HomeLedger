name: Windows program tests

on:
  workflow_dispatch:        # the "Run workflow" button on GitHub

jobs:
  test:
    runs-on: windows-latest
    env:
      HL_TEST_TIMING: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Core tests
        run: python -m unittest tests.test_core
      - name: Program-level tests with timings (starts the real program, kills it, corrupts files...)
        run: python -W ignore -m unittest -v --durations 16 tests.test_integration
